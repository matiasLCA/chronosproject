[ShadowQuality@0]
; Keep occlusion from opaque walls and the stained-glass light functions on Low.
r.ShadowQuality=2
r.LightFunctionQuality=1

[ViewDistanceQuality@Cine]
; Keep the playable Ultra preset below the stock cinematic draw distance.
r.ViewDistanceScale=1.25

[ShadowQuality@Cine]
r.Shadow.RadiusThreshold=0.005
r.Shadow.Virtual.MaxPhysicalPages=5120
r.Shadow.Virtual.SMRT.RayCountDirectional=10
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=4
r.Shadow.Virtual.SMRT.RayCountLocal=10
r.Shadow.Virtual.SMRT.SamplesPerRayLocal=4
r.VolumetricFog.GridPixelSize=6
r.VolumetricFog.HistoryMissSupersampleCount=8

[TextureQuality@Cine]
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.PoolSize=1536
r.MaxAnisotropy=16
r.VT.MaxAnisotropy=16
